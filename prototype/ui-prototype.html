<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NibbleCue prototype</title>
<!--
  NibbleCue click-through prototype. One file, no build, no network.
  Look and feel copied from CuddleCue (Paper ground, white cards, the floating tab bar),
  painted in CuddleCue's Sunny scheme. Foods, guidance and every label come from
  packages/core/src/nibble (foods.data.ts, guidance.data.ts, copy.ts). Demo data only.
-->
<style>
/* ---------- tokens: packages/ui/src/theme/design-tokens.json (color.light + colorScheme.sunny.light) ---------- */
:root{
  --paper:#F6F3EC; --page:#FAE3D0; --page-warm:#FEE9DE; --page-cool:#F2EBCF; --app:#FDF6EB; --app-2:#FBF6E4;
  --card:#FFFFFF; --chrome:rgba(255,255,255,.97); --surface-2:#E7F1F1;
  --line:rgba(18,52,59,.15); --line-2:rgba(18,52,59,.30);
  --text:#12343B; --text-2:#3D5F66; --text-3:#5C7C82;
  --accent:#BA4400; --accent-2:#8B2D01; --accent-soft:#FFEDE0; --on-accent:#FFFFFF;
  --grad:linear-gradient(135deg,#B85603 0%,#9D2F02 100%);
  --milk:#B06E0C; --milk-soft:#FCEDD3;
  --olive:#5F7F1F; --olive-soft:#EAF2D6; --on-olive:#FFFFFF; --solids-disc:#BDE3A7;
  --diaper:#E51F00; --diaper-soft:#F7E6E3;
  --health:#E90049; --health-soft:#F7E3EA;
  --cyan:#1B77A8; --cyan-soft:#DAECF8;
  --good:#16775A; --warn:#845304; --crit:#BE3A42; --danger-fill:#A93540;
  --toast:#12343B; --toast-text:#F3FAFA; --toast-act:#FFA159;
  --shadow:0 1px 2px rgba(47,31,110,.07), 0 10px 26px -16px rgba(47,31,110,.35);
  --shadow-lift:0 2px 8px rgba(47,31,110,.10), 0 26px 50px -22px rgba(47,31,110,.45);
  --cta-glow:0 12px 26px -14px rgba(186,68,0,.8);
  --r-s:9px; --r-m:15px; --r-l:22px; --r-xl:30px;
  --s1:4px; --s2:6px; --s3:8px; --s4:11px; --s5:14px; --s6:18px; --s7:26px;
  --ui:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
/* color.dark + colorScheme.sunny.dark */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14110C; --page:#160902; --page-warm:#201103; --page-cool:#1B0C06; --app:#241308; --app-2:#2D1B0A;
    --card:rgba(255,255,255,.055); --chrome:rgba(36,19,8,.97); --surface-2:#1B2E2F;
    --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.21);
    --text:#E8F3F4; --text-2:#BFD5D8; --text-3:#8BA4A8;
    --accent:#FFA159; --accent-2:#FEC598; --accent-soft:#3D1E05; --on-accent:#270E00;
    --grad:linear-gradient(135deg,#B75901 0%,#993C02 100%);
    --milk:#F2B663; --milk-soft:#3A2A12;
    --olive:#AEC96F; --olive-soft:#252C13; --on-olive:#172005; --solids-disc:#BDE3A7;
    --diaper:#EF573F; --diaper-soft:#3F1812;
    --health:#F14D80; --health-soft:#3F1221;
    --cyan:#63BCE6; --cyan-soft:#112A38;
    --good:#4FC194; --warn:#E0AC55; --crit:#F0827F; --danger-fill:#8E2D35;
    --toast:#3A2414; --toast-text:#FFF3E8; --toast-act:#FFA159;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.9);
    --shadow-lift:0 2px 10px rgba(0,0,0,.5), 0 28px 56px -24px #000;
    --cta-glow:0 12px 26px -14px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14110C; --page:#160902; --page-warm:#201103; --page-cool:#1B0C06; --app:#241308; --app-2:#2D1B0A;
  --card:rgba(255,255,255,.055); --chrome:rgba(36,19,8,.97); --surface-2:#1B2E2F;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.21);
  --text:#E8F3F4; --text-2:#BFD5D8; --text-3:#8BA4A8;
  --accent:#FFA159; --accent-2:#FEC598; --accent-soft:#3D1E05; --on-accent:#270E00;
  --grad:linear-gradient(135deg,#B75901 0%,#993C02 100%);
  --milk:#F2B663; --milk-soft:#3A2A12;
  --olive:#AEC96F; --olive-soft:#252C13; --on-olive:#172005; --solids-disc:#BDE3A7;
  --diaper:#EF573F; --diaper-soft:#3F1812;
  --health:#F14D80; --health-soft:#3F1221;
  --cyan:#63BCE6; --cyan-soft:#112A38;
  --good:#4FC194; --warn:#E0AC55; --crit:#F0827F; --danger-fill:#8E2D35;
  --toast:#3A2414; --toast-text:#FFF3E8; --toast-act:#FFA159;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.9);
  --shadow-lift:0 2px 10px rgba(0,0,0,.5), 0 28px 56px -24px #000;
  --cta-glow:0 12px 26px -14px rgba(0,0,0,.9);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; color:var(--text); font-family:var(--ui); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background-color:var(--page);
  background-image:radial-gradient(760px 520px at 88% -4%, var(--page-warm), transparent 72%), radial-gradient(700px 520px at 4% 8%, var(--page-cool), transparent 70%);
  display:flex; align-items:center; justify-content:center; min-height:100vh}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; text-align:inherit}
input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
svg.i{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
h1,h2,h3,h4,p{margin:0}

/* ---------- the phone ---------- */
.device{position:relative; width:390px; height:844px; border-radius:var(--r-xl); overflow:hidden; overflow:clip; background:var(--paper);
  box-shadow:var(--shadow-lift); border:1px solid var(--line-2); isolation:isolate}
@media (max-width:520px), (max-height:700px){
  body{display:block}
  .device{width:100%; height:100vh; height:100dvh; border-radius:0; border:0; box-shadow:none}
}
.statusbar{position:absolute; top:0; left:0; right:0; height:32px; display:flex; align-items:center; justify-content:space-between;
  padding:6px 18px 0; font-family:var(--mono); font-size:11.5px; color:var(--text-2); z-index:5; background:var(--paper)}
.demotag{font-family:var(--ui); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-2)}
.screen{position:absolute; top:32px; left:0; right:0; bottom:0; overflow-y:auto; overflow-x:hidden; padding:0 16px 120px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.withfab{padding-bottom:160px}
.fadein{animation:fade .18s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- top bar ---------- */
.appbar{display:flex; align-items:center; gap:8px; padding:6px 0 10px}
.babychip{display:flex; align-items:center; gap:9px; min-height:48px; padding:4px 12px 4px 4px; border-radius:999px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
.babychip b{display:block; font-size:15px; line-height:1.15}
.babychip small{display:block; font-size:12px; color:var(--text-2); line-height:1.2}
.av{width:38px; height:38px; border-radius:50%; background-image:var(--grad); color:#fff; display:grid; place-items:center; font-weight:800; font-size:15px; flex:none}
.syncchip{margin-left:auto; display:flex; align-items:center; gap:6px; min-height:44px; padding:0 13px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--text-2)}
.syncchip .dot{width:8px; height:8px; border-radius:50%; background:var(--good)}
.me{width:44px; height:44px; border-radius:50%; background-image:var(--grad); color:#fff; display:grid; place-items:center; font-weight:800}
.pushbar{position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:6px; padding:6px 0 8px; margin:0 -16px; padding-left:8px; padding-right:16px; background:var(--paper)}
.backbtn{display:flex; align-items:center; gap:2px; min-height:44px; min-width:44px; padding:0 10px 0 4px; border-radius:999px; color:var(--accent-2); font-weight:700; font-size:15px}
.backbtn svg{width:22px; height:22px}
.tabtitle{font-size:28px; font-weight:800; letter-spacing:-.025em; line-height:1.15; margin:4px 0 6px}
.h1{font-size:23px; font-weight:800; letter-spacing:-.025em; line-height:1.2; margin:2px 0 6px}
.lede{color:var(--text-2); font-size:14.5px; margin:0 0 12px}
.titlerow{display:flex; align-items:center; gap:8px}
.titlerow .tabtitle{flex:1}

/* ---------- section captions ---------- */
.cap{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:20px 2px 8px; min-height:24px}
.cap h2{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2)}
.link{display:inline-flex; align-items:center; gap:3px; min-height:44px; padding:0 4px; color:var(--accent-2); font-weight:700; font-size:14px}
.link svg{width:16px; height:16px}

/* ---------- cards, rows ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:var(--s5); box-shadow:var(--shadow); margin-bottom:var(--s4)}
.card.flat{box-shadow:none}
.card h3{font-size:16px; font-weight:800; letter-spacing:-.01em}
.meta{font-size:12.5px; color:var(--text-2)}
.muted{color:var(--text-2)}
.small{font-size:13px}
.note{font-size:12.5px; color:var(--text-2); line-height:1.45}
.nma{font-size:12.5px; color:var(--text-2); text-align:center; padding:6px 10px 2px; line-height:1.45}
.group{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow); overflow:hidden; margin-bottom:var(--s4)}
.row{display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:10px 14px; text-align:left}
.group .row + .row, .group .row + .sub, .group .sub + .row{border-top:1px solid var(--line)}
.row .rb{flex:1; min-width:0}
.row .rt{font-weight:700; font-size:15px; display:block}
.row .rs{font-size:12.5px; color:var(--text-2); display:block; margin-top:1px}
.row .chev{color:var(--text-3)}
.row[aria-disabled="true"]{opacity:.6}
.ico{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--accent-soft); color:var(--accent-2)}
.ico svg{width:19px; height:19px}
.ico.olive{background:var(--olive-soft); color:var(--olive)}
.ico.milk{background:var(--milk-soft); color:var(--milk)}
.ico.health{background:var(--health-soft); color:var(--health)}
.ico.cyan{background:var(--cyan-soft); color:var(--cyan)}
.ico.neutral{background:var(--line); color:var(--text-2)}

/* ---------- buttons, chips, badges ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px; padding:0 18px; border-radius:999px; font-weight:700; font-size:14.5px; white-space:nowrap}
.btn svg{width:18px; height:18px}
.btn.primary{background-image:var(--grad); color:#fff; box-shadow:var(--cta-glow)}
.btn.olive{background:var(--olive); color:var(--on-olive)}
.btn.ghost{background:var(--card); border:1px solid var(--line-2); color:var(--text)}
.btn.soft{background:var(--accent-soft); color:var(--accent-2)}
.btn.block{display:flex; width:100%; min-height:54px; font-size:16px}
.btn[disabled]{opacity:.45; cursor:default; box-shadow:none}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}
.btnrow .btn{flex:1}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips.scroll{flex-wrap:nowrap; overflow-x:auto; margin:0 -16px; padding:2px 16px 4px; scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line-2); background:var(--card); font-size:14px; color:var(--text); white-space:nowrap; flex:none}
.chip[aria-pressed="true"], .chip[aria-checked="true"]{background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:700}
.chip.danger[aria-pressed="true"]{background:var(--danger-fill); color:#fff}
.chip svg{width:16px; height:16px}
.badges{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:3px 7px; border-radius:7px; line-height:1.3; background:var(--line); color:var(--text-2)}
.badge svg{width:11px; height:11px; stroke-width:2.4}
.b-new{background:var(--accent-soft); color:var(--accent-2)}
.b-first{background:var(--milk-soft); color:var(--milk)}
.b-keep{background:var(--olive-soft); color:var(--olive)}
.b-iron{background:var(--diaper-soft); color:var(--diaper)}
.b-hold{background:var(--health-soft); color:var(--health)}
.b-plus{background-image:var(--grad); color:#fff}
.b-tried{background:var(--olive-soft); color:var(--olive)}
.b-pin{background:var(--accent-soft); color:var(--accent-2)}

/* ---------- guidance card ---------- */
.guide{border-left:0; position:relative; overflow:hidden}
.guide .eyebrow{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-2); margin-bottom:6px}
.guide .eyebrow svg{width:15px; height:15px}
.guide p{font-size:14.5px; color:var(--text); margin-top:4px}
.guide ul{margin:10px 0 0; padding-left:18px; font-size:13.5px; color:var(--text-2)}
.guide ul li + li{margin-top:4px}
.src{font-size:11.5px; color:var(--text-2); margin-top:10px}
.guide .gfoot .link{margin-left:-4px}
.guide .gfoot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px}

/* ---------- meals ---------- */
.meal{padding:0; overflow:hidden}
.mealhead{display:flex; align-items:center; gap:11px; padding:14px 14px 6px}
.disc{width:40px; height:40px; border-radius:50%; background:var(--solids-disc); color:#2F4A0C; display:grid; place-items:center; flex:none}
.disc svg{width:21px; height:21px}
.mealhead h3{font-size:17px; font-weight:800}
.mealhead .meta{margin-top:1px}
.mealhead .state{margin-left:auto}
.foods{list-style:none; margin:0; padding:0 6px}
.foodrow{display:flex; align-items:flex-start; gap:11px; width:100%; min-height:56px; padding:10px 8px; border-radius:var(--r-m); text-align:left}
.foodrow:active{background:var(--olive-soft)}
.foods li + li .foodrow{border-top:1px solid var(--line); border-radius:0}
.fdisc{width:36px; height:36px; border-radius:50%; background:var(--olive-soft); color:var(--olive); display:grid; place-items:center; flex:none; margin-top:1px}
.fdisc svg{width:19px; height:19px}
.fb{flex:1; min-width:0}
.fname{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; font-weight:700; font-size:15.5px}
.form{font-size:12.5px; font-weight:600; color:var(--olive)}
.why{display:block; font-size:13px; color:var(--text-2); margin-top:2px; line-height:1.4}
.foodrow .chev{color:var(--text-3); margin-top:8px}
.tip{display:flex; gap:8px; margin:6px 14px 0; padding:10px 12px; border-radius:var(--r-m); background:var(--milk-soft); color:var(--text); font-size:13px; line-height:1.4}
.tip svg{width:17px; height:17px; color:var(--milk); margin-top:1px}
.mealacts{display:flex; gap:8px; padding:12px 14px 14px}
.mealacts .btn.primary{flex:1}
.served{display:flex; align-items:center; gap:10px; margin:6px 14px 14px; padding:8px 8px 8px 12px; border-radius:var(--r-m); background:var(--olive-soft); color:var(--text)}
.served .tick{width:28px; height:28px; border-radius:50%; background:var(--olive); color:var(--on-olive); display:grid; place-items:center; flex:none}
.served .tick svg{width:16px; height:16px; stroke-width:2.4}
.served b{font-size:14.5px}
.served .btn{margin-left:auto; min-height:44px; padding:0 12px; font-size:13.5px}
.takenout{margin:2px 14px 4px; font-size:12.5px; color:var(--text-2)}

/* allergen meter */
.alrow{display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 0}
.alrow + .alrow{border-top:1px solid var(--line)}
.alrow .an{font-weight:700; font-size:15px}
.alrow .as{font-size:12.5px; color:var(--text-2)}
.alrow .ac{margin-left:auto; text-align:right; font-size:12.5px; color:var(--text-2)}
.pips{display:flex; gap:4px; margin-top:5px; justify-content:flex-end}
.pip{width:16px; height:6px; border-radius:999px; background:var(--line-2)}
.pip.on{background:var(--olive)}

.noticebtn{display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:12px 14px; border-radius:var(--r-l); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); text-align:left; margin-bottom:var(--s4)}
.noticebtn b{display:block; font-size:15.5px}
.noticebtn span.sub{display:block; font-size:12.5px; color:var(--text-2)}

.mini{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mini .mm{border-radius:var(--r-m); background:var(--olive-soft); padding:10px 12px}
.mini .mm h4{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--olive); margin-bottom:4px}
.mini .mm p{font-size:13.5px; line-height:1.45}

/* ---------- plan ---------- */
.strip{display:flex; gap:10px; overflow-x:auto; margin:0 -16px; padding:2px 16px 18px; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chg{flex:none; width:178px; border-radius:var(--r-l); background:var(--card); border:1px solid var(--line); padding:12px; box-shadow:var(--shadow)}
.chg .ico{margin-bottom:8px}
.chg b{display:block; font-size:14px; line-height:1.3}
.chg > span:not(.ico){display:block; font-size:12.5px; color:var(--text-2); margin-top:3px; line-height:1.35}
.day{padding:0; overflow:hidden}
.dayhead{display:flex; align-items:center; gap:4px; padding:4px 4px 4px 0}
.daytoggle{flex:1; display:flex; align-items:center; gap:11px; min-height:60px; padding:8px 6px 8px 14px; text-align:left}
.daytoggle .dn{font-weight:800; font-size:16px}
.daytoggle .dd{font-size:12.5px; color:var(--text-2)}
.daytoggle .cv{margin-left:auto; color:var(--text-3); transition:transform .18s}
.daytoggle[aria-expanded="true"] .cv{transform:rotate(180deg)}
.dots{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--text-2)}
.daybody{padding:0 14px 12px}
.pmeal + .pmeal{margin-top:6px}
.pmeal h4{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--olive); margin:6px 2px 2px}
.pfood{display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:7px 2px; text-align:left; border-radius:0}
.pfood + .pfood{border-top:1px solid var(--line)}
.pfood .fname{font-size:14.5px}
.pfood .form{font-size:12px}
.pfood .why{font-size:12.5px; margin-top:0}
.skipped{display:flex; align-items:center; gap:10px; padding:4px 0}
.locked .daytoggle .dn{color:var(--text-2)}
.lockico{color:var(--text-2)}
.skel{display:grid; gap:7px; padding:2px 0 4px}
.skel .bar{height:12px; border-radius:999px; background:var(--line)}
.skel .bar.s{width:46%} .skel .bar.m{width:64%} .skel .bar.l{width:80%}
.skel h4{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin:6px 2px 0}
.paywall{background:var(--accent-soft); border-color:transparent}
.paywall h3{color:var(--text)}
.paywall p{font-size:14px; color:var(--text); margin:6px 0 12px}

/* ---------- foods ---------- */
.search{display:flex; align-items:center; gap:8px; min-height:48px; padding:0 14px; border-radius:var(--r-m); border:1px solid var(--line-2); background:var(--card); margin-bottom:10px}
.search input{flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:15px; min-height:44px}
.search svg{color:var(--text-2)}
.frow{display:flex; align-items:center; gap:12px; width:100%; min-height:60px; padding:8px 14px; text-align:left}
.group .frow + .frow{border-top:1px solid var(--line)}
.frow .fb b{display:block; font-size:15px}
.frow .fb span{display:block; font-size:12.5px; color:var(--text-2)}
.frow .badge{flex:none}
.empty{text-align:center; color:var(--text-2); padding:26px 10px; font-size:14px}
.detailhead{display:flex; align-items:center; gap:12px; margin:4px 0 10px}
.detailhead .fdisc{width:52px; height:52px}
.detailhead .fdisc svg{width:26px; height:26px}
.sec{margin-top:14px}
.sec h4{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); margin-bottom:6px}
.sec p{font-size:14.5px}
.sec ul{margin:0; padding-left:18px; font-size:14px}
.formchips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.formchip{font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--olive-soft); color:var(--olive)}
.choke{display:flex; gap:9px; padding:11px 12px; border-radius:var(--r-m); background:var(--milk-soft); font-size:14px}
.choke svg{color:var(--milk); margin-top:1px}
.hist{display:flex; gap:9px; padding:11px 12px; border-radius:var(--r-m); background:var(--olive-soft); font-size:14px}
.hist svg{color:var(--olive); margin-top:1px}
.held{display:flex; gap:9px; padding:11px 12px; border-radius:var(--r-m); background:var(--health-soft); font-size:14px}
.held svg{color:var(--health); margin-top:1px}
.tick{display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:4px 2px; text-align:left; font-size:15px}
.tick .box{width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line-2); display:grid; place-items:center; flex:none; background:var(--card)}
.tick .box svg{width:15px; height:15px; stroke-width:2.6; opacity:0}
.tick[aria-checked="true"] .box{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.tick[aria-checked="true"] .box svg{opacity:1}
.ticks{display:grid; grid-template-columns:1fr 1fr; column-gap:10px}
.field{width:100%; min-height:48px; padding:10px 14px; border-radius:var(--r-m); border:1px solid var(--line-2); background:var(--card); font-size:15px; outline:0}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:84px; resize:none}
.fieldlbl{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); margin:16px 2px 8px}
.fieldlbl:first-child{margin-top:4px}

/* ---------- shopping (CuddleCue's list) ---------- */
.progress{height:8px; border-radius:999px; background:var(--accent-soft); overflow:hidden; margin:12px 0 10px}
.progress i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .18s}
.addrow{display:flex; gap:8px}
.addrow .field{flex:1}
.shop{display:flex; align-items:center; gap:12px; padding:10px 8px 10px 12px; min-height:60px}
.group .shop + .shop{border-top:1px solid var(--line)}
.round{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center; flex:none; background:var(--card)}
.round svg{width:16px; height:16px; stroke-width:2.6; opacity:0}
.roundbtn{width:44px; height:44px; display:grid; place-items:center; flex:none; margin:-7px}
.roundbtn[aria-checked="true"] .round{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.roundbtn[aria-checked="true"] .round svg{opacity:1}
.shop .sb{flex:1; min-width:0; padding-left:6px}
.shop .sb b{display:block; font-size:15px}
.shop .sb span{display:block; font-size:12.5px; color:var(--text-2)}
.shop.done .sb b{text-decoration:line-through; color:var(--text-2)}
.qty{display:flex; align-items:center; border-radius:999px; background:var(--accent-soft); padding:2px}
.qty button{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--accent-2)}
.qty button svg{width:16px; height:16px; stroke-width:2.4}
.qty .n{min-width:22px; text-align:center; font-family:var(--mono); font-size:14px; font-weight:600}
.xbtn{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--text-2)}

/* ---------- plus, stats ---------- */
.hero{border-radius:var(--r-l); padding:18px; background-image:var(--grad); color:#fff; margin-bottom:var(--s4); box-shadow:var(--cta-glow)}
.hero h2{font-size:22px; font-weight:800; letter-spacing:-.02em}
.hero p{font-size:14.5px; margin-top:6px; opacity:.95}
.list{list-style:none; margin:0; padding:0}
.list li{display:flex; gap:10px; padding:8px 0; font-size:14.5px; line-height:1.4}
.list li + li{border-top:1px solid var(--line)}
.list li svg{width:18px; height:18px; color:var(--olive); margin-top:1px; stroke-width:2.2}
.list.plus li svg{color:var(--accent)}
.price{display:flex; align-items:center; gap:10px; min-height:60px; padding:10px 14px}
.price + .price{border-top:1px solid var(--line)}
.price .pb{flex:1}
.price .pb b{display:block}
.price .pb span{display:block; font-size:12.5px; color:var(--text-2)}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0}
.stat{border-radius:var(--r-m); background:var(--milk-soft); padding:12px}
.stat .k{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2)}
.stat .v{font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-.02em; color:var(--text); margin-top:3px}
.stat .v small{font-family:var(--ui); font-size:13px; font-weight:600; color:var(--text-2); letter-spacing:0}
.bars{display:flex; align-items:flex-end; gap:8px; height:84px; padding:6px 2px 0}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--text-2)}
.bars .b i{display:block; width:100%; border-radius:6px 6px 3px 3px; background:var(--milk)}
.blurred{filter:blur(6px); user-select:none; pointer-events:none}
.lockover{position:relative}
.lockover .lockmsg{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px}
.seg{display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--line)}
.seg button{flex:1; min-height:44px; border-radius:999px; font-weight:700; font-size:14px; color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--accent-2); box-shadow:var(--shadow)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--accent-soft)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--accent-soft)} }
.swatches{display:flex; flex-wrap:wrap; gap:10px}
.swatch{display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; min-height:72px; font-size:12px; font-weight:600; color:var(--text-2)}
.swatch .sw{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff; border:2px solid transparent}
.swatch[aria-pressed="true"] .sw{outline:2px solid var(--accent); outline-offset:2px}
.swatch .sw svg{width:16px; height:16px}

/* ---------- tab bar (CuddleCue's TabBar: pill inset 12, 10 above the foot, radius 30, 44 log button above) ---------- */
.tabbar{position:absolute; left:12px; right:12px; bottom:10px; z-index:20; pointer-events:none}
.fabrow{display:flex; justify-content:center; margin-bottom:8px; height:44px}
.fab{pointer-events:auto; width:44px; height:44px; border-radius:50%; background-image:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:0 10px 18px -6px rgba(186,68,0,.7); transition:opacity .18s}
.fab svg{width:22px; height:22px; stroke-width:2.4}
.fab[hidden]{display:grid; opacity:0; pointer-events:none}
.bar{pointer-events:auto; position:relative; display:flex; align-items:stretch; gap:2px; padding:7px 10px; border-radius:var(--r-xl); background:var(--chrome); box-shadow:0 1px 2px rgba(47,31,110,.08), 0 20px 38px -22px rgba(23,16,54,.45); -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px)}
.bar button{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 11px; border-radius:var(--r-s); color:var(--text-2); font-size:10.5px; font-weight:700; line-height:1.15}
.bar button svg{width:23px; height:23px; color:var(--text-3)}
.bar button[aria-selected="true"]{background:var(--accent-soft); color:var(--accent-2); font-weight:800}
.bar button[aria-selected="true"] svg{color:var(--accent-2)}
.bar .tdot{position:absolute; bottom:8px; width:5px; height:5px; border-radius:50%; background:var(--accent-2); pointer-events:none}

/* ---------- sheet, scrim, toast ---------- */
.scrim{position:absolute; inset:0; z-index:40; background:rgba(20,10,2,.42); opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:50; max-height:90%; display:flex; flex-direction:column; background-color:var(--app);
  background-image:radial-gradient(340px 200px at 88% 0%, var(--page-warm), transparent 70%);
  border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:0 -26px 60px -30px rgba(23,16,54,.42); transform:translateY(105%); transition:transform .22s cubic-bezier(.22,.8,.28,1); visibility:hidden}
.sheet.on{transform:none; visibility:visible}
.grab{width:40px; height:4px; border-radius:999px; background:var(--line-2); margin:9px auto 2px; flex:none}
.shead{display:flex; align-items:center; gap:10px; padding:4px 12px 6px 18px; flex:none}
.shead h2{font-size:18px; font-weight:800; letter-spacing:-.015em; flex:1}
.x{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--text-2); background:var(--card); border:1px solid var(--line)}
.sbody{padding:2px 18px 22px; overflow-y:auto}
.sbody > .fadein{min-height:20px}
.sheetfoot{margin-top:16px}
.toast{position:absolute; left:12px; right:12px; bottom:96px; z-index:60; display:flex; align-items:center; gap:10px; min-height:52px; padding:6px 6px 6px 16px; border-radius:20px;
  background:var(--toast); color:var(--toast-text); font-size:14px; font-weight:600; box-shadow:0 18px 40px -18px rgba(20,12,48,.8); opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s; pointer-events:none}
.toast.on{opacity:1; transform:none; pointer-events:auto}
.toast.high{bottom:150px}
.sheet.on ~ .toast{bottom:auto; top:40px}
.toast span{flex:1}
.toast button{min-height:44px; padding:0 14px; border-radius:999px; color:var(--toast-act); font-weight:800}

/* serve tiles (CuddleCue .gotiles: four equal tiles, a face over a short word, chosen = the module's color) */
.gotiles{display:flex; gap:6px}
.gotiles button{flex:1 1 0; min-width:0; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:7px 3px;
  border:1px solid var(--line-2); border-radius:var(--r-m); background:var(--card); font-size:12.5px; line-height:1.2; color:var(--text-2); text-align:center}
.gotiles .face{width:26px; height:26px; color:var(--olive)}
.gotiles button[aria-checked="true"]{padding:6px 2px; border:2px solid var(--olive); background:var(--olive-soft); color:var(--text); font-weight:700}
.gotiles.small button{min-height:48px; padding:4px 2px}
.gotiles.small .face{width:20px; height:20px}
.perfood{padding:10px 0}
.perfood + .perfood{border-top:1px solid var(--line)}
.perfood b{display:block; margin-bottom:6px; font-size:14.5px}
.switchrow{display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:6px 0; text-align:left}
.switchrow .rb{flex:1}
.switchrow b{display:block; font-size:15px}
.switchrow span.s{display:block; font-size:12.5px; color:var(--text-2)}
.switch{width:50px; height:30px; border-radius:999px; background:var(--line-2); position:relative; flex:none; transition:background .18s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s}
[aria-checked="true"] > .switch{background:var(--accent)}
[aria-checked="true"] > .switch::after{transform:translateX(20px)}
.refusal{margin-top:10px; padding:10px 12px; border-radius:var(--r-m); background:var(--olive-soft); font-size:13.5px}
.alt{display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-l); background:var(--card); margin-bottom:8px}
.alt .fb b{font-size:15px}
.alt .btn{min-height:44px; padding:0 14px}
.optcard{display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:12px 14px; border-radius:var(--r-l); border:1px solid var(--line-2); background:var(--card); text-align:left; margin-bottom:8px}
.optcard .rb{flex:1}
.optcard b{display:block; font-size:15.5px}
.optcard span.s{display:block; font-size:13px; color:var(--text-2); margin-top:2px}
.optcard .radio{width:24px; height:24px; border-radius:50%; border:2px solid var(--line-2); flex:none; display:grid; place-items:center}
.optcard[aria-checked="true"]{border:2px solid var(--accent); background:var(--accent-soft); padding:11px 13px}
.optcard[aria-checked="true"] .radio{border-color:var(--accent)}
.optcard[aria-checked="true"] .radio::after{content:""; width:12px; height:12px; border-radius:50%; background:var(--accent)}
.danger-text{color:var(--crit)}

/* ---------- emergency card ---------- */
.emerg{position:absolute; inset:0; z-index:90; background:var(--danger-fill); color:#fff; display:flex; flex-direction:column; padding:56px 22px 28px; opacity:0; pointer-events:none; transition:opacity .18s; overflow-y:auto}
.emerg.on{opacity:1; pointer-events:auto}
.emerg .big{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center; margin-bottom:18px}
.emerg .big svg{width:34px; height:34px; stroke-width:2}
.emerg h2{font-size:38px; font-weight:800; letter-spacing:-.03em; line-height:1.05}
.emerg p{font-size:16.5px; line-height:1.45; margin-top:12px}
.emerg .call{display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:76px; margin-top:26px; border-radius:999px; background:#fff; color:#8E2D35; font-size:24px; font-weight:800; box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.emerg .call svg{width:28px; height:28px; stroke-width:2.2}
.emerg ul{margin:22px 0 0; padding:0; list-style:none}
.emerg li{padding:10px 0; border-top:1px solid rgba(255,255,255,.22); font-size:15px; line-height:1.4}
.emerg .back{margin-top:auto; padding-top:20px}
.emerg .back .btn{width:100%; min-height:54px; border:1.5px solid rgba(255,255,255,.7); color:#fff; font-size:16px}
.emerg .demo{font-size:12.5px; opacity:.9; margin-top:10px; text-align:center}

/* ---------- setup ---------- */
.setup{position:absolute; inset:0; z-index:70; background:var(--paper); display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .18s}
.setup.on{opacity:1; pointer-events:auto}
.sutop{display:flex; align-items:center; gap:8px; padding:40px 12px 6px 8px; flex:none}
.sutop .pbar{flex:1; height:8px; border-radius:999px; background:var(--accent-soft); overflow:hidden}
.sutop .pbar i{display:block; height:100%; background-image:var(--grad); border-radius:999px; transition:width .18s}
.sutop .cnt{font-family:var(--mono); font-size:12px; color:var(--text-2); min-width:52px; text-align:right}
.subody{flex:1; overflow-y:auto; padding:12px 20px 20px}
.subody .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-2)}
.subody h2{font-size:26px; font-weight:800; letter-spacing:-.025em; line-height:1.15; margin:6px 0 8px}
.subody .help{color:var(--text-2); font-size:14.5px; margin-bottom:16px}
.sufoot{flex:none; padding:10px 20px 26px; display:grid; gap:4px; background:var(--paper)}
.reveal .card{opacity:0; animation:fade .18s ease-out forwards}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>

const DATA = {"foods":[{"id":"sweet-potato","name":"Sweet potato","cat":"vegetable","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Roast or steam until very soft. Mash it, or offer peeled wedges about the size of an adult finger.","choke":null,"ideas":["Mash with a little olive oil and a pinch of cinnamon.","Bake thin wedges until soft all the way through."],"src":["aap-starting-solids"]},{"id":"butternut-squash","name":"Butternut squash","cat":"vegetable","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Roast or steam until very soft. Mash it, or offer peeled wedges about the size of an adult finger.","choke":null,"ideas":["Mash with a pinch of cinnamon or cumin.","Stir into oatmeal or risotto."],"src":["aap-starting-solids"]},{"id":"carrot","name":"Carrot","cat":"vegetable","al":[],"risk":"high","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Cook until it squashes easily between your fingers. Offer finger-size cooked sticks, or mash.","choke":"Raw carrot is a common choking risk. Cook it until it squashes easily, and avoid round coins.","ideas":["Roast sticks with a little olive oil until very soft.","Mash with cumin and a squeeze of orange."],"src":["aap-choking","aap-starting-solids"]},{"id":"peas","name":"Peas","cat":"vegetable","al":[],"risk":"medium","ff":true,"iron":1,"forms":["puree","mashed"],"how":"Cook until soft, then blend or mash well.","choke":"Whole peas are small and round. Mash or flatten them for younger babies.","ideas":["Mash with fresh mint and olive oil.","Stir into rice or dal."],"src":["aap-choking","aap-starting-solids"]},{"id":"broccoli","name":"Broccoli","cat":"vegetable","al":[],"risk":"low","ff":true,"iron":1,"forms":["puree","mashed","soft_stick"],"how":"Steam until very soft. Offer a large floret with the stalk as a handle, or blend.","choke":null,"ideas":["Serve with beans or lentils. Its vitamin C helps the body take in plant iron.","Roast with olive oil until tender."],"src":["aap-starting-solids","cdc-iron"]},{"id":"zucchini","name":"Zucchini","cat":"vegetable","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Steam or roast until soft. Offer spears with some skin left on for grip, or mash.","choke":null,"ideas":["Grate into fritters or soft muffins.","Stir into a tomato sauce."],"src":["aap-starting-solids"]},{"id":"spinach","name":"Spinach","cat":"vegetable","al":[],"risk":"low","ff":false,"iron":2,"forms":["puree","mixed_in"],"how":"Cook and blend finely, then stir into a puree or grain.","choke":null,"ideas":["Serve with tomato or orange. Vitamin C helps the body take in its iron.","Blend into a green sauce for pasta or rice."],"src":["cdc-iron","aap-starting-solids"]},{"id":"avocado","name":"Avocado","cat":"fruit","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Mash ripe avocado, or offer thick spears. Rolling spears in infant cereal makes them easier to hold.","choke":null,"ideas":["Mash with banana for a creamy mix.","Serve with black beans."],"src":["aap-starting-solids"]},{"id":"banana","name":"Banana","cat":"fruit","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Mash ripe banana, or offer a large piece of ripe banana to hold.","choke":null,"ideas":["Mash into oatmeal for natural sweetness.","A lot of banana can firm stools. Pears or prunes can help balance it."],"src":["aap-starting-solids","harvard-constipation"]},{"id":"pear","name":"Pear","cat":"fruit","al":[],"risk":"medium","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Use very ripe pear, or cook it until soft. Offer peeled wedges that squash easily, or puree.","choke":"Firm, unripe pear can break into hard pieces. Choose very ripe pear, or cook it.","ideas":["Pears can help soften stools.","Mash with avocado or stir into oatmeal."],"src":["aap-choking","harvard-constipation"]},{"id":"peach","name":"Peach","cat":"fruit","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Offer ripe, peeled wedges with the pit removed, or puree.","choke":null,"ideas":["Peaches can help soften stools.","Frozen peaches work well thawed and mashed."],"src":["aap-starting-solids","harvard-constipation"]},{"id":"mango","name":"Mango","cat":"fruit","al":[],"risk":"low","ff":true,"iron":0,"forms":["puree","mashed","soft_stick"],"how":"Offer ripe, peeled spears, or mash.","choke":null,"ideas":["Serve with lentils or beans. Its vitamin C helps the body take in plant iron.","Freeze ripe mango puree in small portions."],"src":["aap-starting-solids","cdc-iron"]},{"id":"blueberry","name":"Blueberry","cat":"fruit","al":[],"risk":"high","ff":false,"iron":0,"forms":["mashed","finger"],"how":"Flatten each berry between your fingers until it bursts, or mash.","choke":"Whole blueberries are small and round. Flatten or halve them before serving.","ideas":["Frozen blueberries work well thawed and flattened.","Stir flattened berries into oatmeal."],"src":["aap-choking"]},{"id":"prune","name":"Prune","cat":"fruit","al":[],"risk":"medium","ff":false,"iron":1,"forms":["puree","mixed_in"],"how":"Soak or simmer pitted prunes until very soft, then blend.","choke":"Whole dried prunes are chewy and sticky. Soak and blend them, or chop them small.","ideas":["Prune puree is a common way to help soften stools.","Stir a spoonful into oatmeal."],"src":["harvard-constipation","aap-choking"]},{"id":"strawberry","name":"Strawberry","cat":"fruit","al":[],"risk":"medium","ff":false,"iron":0,"forms":["puree","mashed","finger"],"how":"Mash ripe strawberries, or cut them into thin slices.","choke":"Firm whole berries can be a choking risk. Mash them or cut them into small pieces.","ideas":["Its vitamin C pairs well with iron-fortified cereal.","Stir mashed berries into oatmeal."],"src":["aap-choking","cdc-iron"]},{"id":"infant-oat-cereal","name":"Iron-fortified oat cereal","cat":"grain","al":[],"risk":"low","ff":true,"iron":3,"forms":["puree","mixed_in"],"how":"Mix with breast milk, formula or water until smooth and runny, and offer from a spoon, never a bottle.","choke":null,"ideas":["Mix in a vitamin C fruit like mango or strawberry.","Thicken it a little more each week as your baby gets used to it."],"src":["cdc-iron","aap-starting-solids"]},{"id":"oatmeal","name":"Oatmeal","cat":"grain","al":[],"risk":"low","ff":true,"iron":1,"forms":["puree","mashed","mixed_in"],"how":"Cook oats until very soft, then blend or mash with breast milk, formula or water.","choke":null,"ideas":["Stir in mashed banana or berries.","Bake with mashed banana into soft oat fingers."],"src":["aap-starting-solids"]},{"id":"quinoa","name":"Quinoa","cat":"grain","al":[],"risk":"low","ff":false,"iron":1,"forms":["mashed","lumpy","mixed_in"],"how":"Rinse, cook until very soft and mash or mix into a puree.","choke":null,"ideas":["Rinse well before cooking to remove the bitter coating.","Mix with mashed black beans and avocado."],"src":["aap-starting-solids"]},{"id":"pasta","name":"Pasta","cat":"grain","al":["wheat"],"risk":"low","ff":false,"iron":1,"forms":["mashed","minced","soft_stick"],"how":"Cook until very soft. Offer large shapes like penne or fusilli, or chop finely.","choke":null,"ideas":["Check the label. Egg pasta also contains egg.","Toss with a vegetable puree as a sauce."],"src":["aap-allergens","aap-starting-solids"]},{"id":"beef","name":"Beef","cat":"meat","al":[],"risk":"medium","ff":true,"iron":3,"forms":["puree","mashed","minced","soft_stick"],"how":"Cook until no pink remains. Blend with cooking liquid, offer soft ground beef, or a large strip of slow-cooked beef to suck on.","choke":"Tough or dry chunks of meat are a choking risk. Cook until tender, then shred, grind or cut it small.","ideas":["Mix ground beef into a tomato sauce.","Slow cook until it falls apart."],"src":["cdc-iron","aap-choking","cdc-food-safety-under-5"]},{"id":"chicken-thigh","name":"Chicken thigh","cat":"meat","al":[],"risk":"medium","ff":true,"iron":2,"forms":["puree","mashed","minced","soft_stick"],"how":"Cook through, remove skin and bones, then blend, shred finely or offer a large tender strip.","choke":"Small bones and dry chunks are a choking risk. Remove every bone and shred or chop the meat.","ideas":["Thigh meat stays moister than breast, so it is easier to chew.","Dark meat has more iron than white meat."],"src":["cdc-iron","aap-choking","cdc-food-safety-under-5"]},{"id":"salmon","name":"Salmon","cat":"fish","al":["fish"],"risk":"medium","ff":false,"iron":1,"forms":["mashed","minced","soft_stick"],"how":"Cook until it flakes easily. Check carefully for bones, then flake or mash.","choke":"Fish can hide small bones. Flake it with your fingers and check carefully before serving.","ideas":["Mix flaked salmon with mashed potato into soft patties.","Salmon is low in mercury and rich in omega-3 fats."],"src":["aap-allergens","aap-choking","usda-dga"]},{"id":"egg","name":"Egg","cat":"egg","al":["egg"],"risk":"low","ff":false,"iron":2,"forms":["puree","mashed","mixed_in","soft_stick"],"how":"Cook until the white and yolk are fully firm. Mash hard-boiled egg with breast milk or formula, or cut a thin omelet into strips.","choke":null,"ideas":["For a first taste, mix a little mashed hard-boiled egg into a puree your baby already eats.","Once it is tolerated, keep offering egg a few times a week."],"src":["aap-allergens","cdc-food-safety-under-5","cdc-iron"]},{"id":"plain-yogurt","name":"Plain whole-milk yogurt","cat":"dairy","al":["milk"],"risk":"low","ff":false,"iron":0,"forms":["puree","mixed_in"],"how":"Choose plain, whole-milk yogurt with no added sugar. Offer from a preloaded spoon.","choke":null,"ideas":["Swirl in mashed fruit instead of buying flavored yogurt.","Once it is tolerated, keep offering milk foods a few times a week."],"src":["aap-allergens","usda-dga"]},{"id":"red-lentils","name":"Red lentils","cat":"plant_protein","al":[],"risk":"low","ff":true,"iron":2,"forms":["puree","mashed"],"how":"Cook until very soft and falling apart, then blend or mash.","choke":null,"ideas":["Pair with tomato or bell pepper. Vitamin C helps the body take in the iron.","Cook with cumin and turmeric for a mild dal."],"src":["cdc-iron","aap-starting-solids"]},{"id":"black-beans","name":"Black beans","cat":"plant_protein","al":[],"risk":"medium","ff":false,"iron":2,"forms":["puree","mashed"],"how":"Cook until very soft, or rinse canned beans, then mash or blend.","choke":"Whole beans can be slippery and firm. Mash or flatten them for younger babies.","ideas":["Choose canned beans with no added salt, and rinse them.","Serve with mango or bell pepper to help the body take in the iron."],"src":["cdc-iron","aap-choking"]},{"id":"tofu","name":"Tofu","cat":"plant_protein","al":["soy"],"risk":"low","ff":false,"iron":2,"forms":["puree","mashed","soft_stick","mixed_in"],"how":"Mash soft or silken tofu, or warm firm tofu and cut it into finger-size strips.","choke":null,"ideas":["Calcium-set tofu adds calcium. Check the label.","Pair with broccoli or bell pepper. Vitamin C helps the body take in the iron."],"src":["aap-allergens","cdc-iron"]},{"id":"peanut-butter","name":"Peanut butter","cat":"nut_seed","al":["peanut"],"risk":"high","ff":false,"iron":1,"forms":["mixed_in","spread"],"how":"Use smooth peanut butter. Thin it with warm water, breast milk or formula, or stir it into a puree. Spread only a thin layer.","choke":"Thick or chunky peanut butter and spoonfuls of it are a choking risk. Use it smooth, thinned or thinly spread.","ideas":["For a first taste, stir a little thinned peanut butter into a puree your baby already eats.","Once it is tolerated, keep offering peanut a few times a week."],"src":["aap-allergens","niaid-peanut","aap-choking"]},{"id":"peanut-powder","name":"Peanut powder","cat":"nut_seed","al":["peanut"],"risk":"low","ff":false,"iron":1,"forms":["mixed_in"],"how":"Stir a small amount into a smooth puree like oatmeal or applesauce until fully blended.","choke":null,"ideas":["Choose plain peanut powder with no added sugar or salt.","Once it is tolerated, keep offering peanut a few times a week."],"src":["aap-allergens","niaid-peanut"]},{"id":"hummus","name":"Hummus","cat":"plant_protein","al":["sesame"],"risk":"low","ff":false,"iron":2,"forms":["puree","spread","mixed_in"],"how":"Offer from a preloaded spoon, or spread thinly on a soft food. Choose one low in salt, or make your own.","choke":null,"ideas":["Hummus contains sesame from tahini, so it counts as a sesame food.","Thin with water for a smoother texture."],"src":["aap-allergens","cdc-iron"]},{"id":"tahini","name":"Tahini","cat":"nut_seed","al":["sesame"],"risk":"medium","ff":false,"iron":1,"forms":["mixed_in","spread"],"how":"Thin with warm water, or stir a little into a puree. Spread only a thin layer.","choke":"Thick spoonfuls of seed paste can be hard to swallow. Thin it, stir it in or spread it thinly.","ideas":["Stir into mashed sweet potato or lentils.","Once it is tolerated, keep offering sesame a few times a week."],"src":["aap-allergens","aap-choking"]},{"id":"cashew-butter","name":"Cashew butter","cat":"nut_seed","al":["cashew"],"risk":"high","ff":false,"iron":1,"forms":["mixed_in","spread"],"how":"Thin smooth cashew butter with warm water, or stir finely ground cashews into a puree. Spread only a thin layer.","choke":"Whole and chopped nuts and thick nut butter are choking risks. Use smooth, thinned butter or finely ground nuts.","ideas":["Introduce each tree nut on its own day.","Stir into a mild curry or oatmeal."],"src":["aap-allergens","aap-choking"]},{"id":"ground-flaxseed","name":"Ground flaxseed","cat":"nut_seed","al":[],"risk":"low","ff":false,"iron":1,"forms":["mixed_in"],"how":"Stir a small amount of ground flaxseed into oatmeal or a puree.","choke":null,"ideas":["A plant source of omega-3 fats, helpful for plant-based families.","Keep ground flax in the fridge so it stays fresh."],"src":["healthlink-vegan"]}],"guidance":[{"id":"readiness-signs","title":"Signs of readiness for solids","body":"Most babies are ready for solids around 6 months. Readiness is about skills, not the calendar: steady head control, sitting with support and real interest in food.","points":["Holds the head steady and upright.","Sits with support.","Opens the mouth when food comes near.","Swallows food rather than pushing it back out.","Reaches for things and brings them to the mouth.","Solids are not recommended before 4 months."],"src":["cdc-faqs","aap-starting-solids"]},{"id":"milk-is-main","title":"Milk is still the main food","body":"Until about 12 months, breast milk or formula gives most of what your baby needs. Food is for exploring and practice.","points":["Offering milk first, then food, is common in the early months.","Closer to 12 months, many families offer food first, then milk."],"src":["aap-starting-solids","usda-dga"]},{"id":"responsive-feeding","title":"You decide what, your baby decides how much","body":"You choose what to offer, and when and where. Your baby decides whether to eat and how much. Turning away, closing the mouth or pushing the spoon are common ways of saying \"all done.\"","points":["Follow your baby's pace, and stop when your baby shows signs of being full.","Skip praise or rewards for finishing, and skip pressure to take one more bite.","Eating amounts go up and down from day to day; that is common."],"src":["satter-sdor","cdc-mealtime"]},{"id":"how-much-to-start","title":"How much to offer at first","body":"Start with a teaspoon or two, once a day. Let your baby lead, and build slowly toward two or three meals a day over the next few months.","points":["Watch your baby, not the bowl.","Some days your baby will eat more, some days less.","Never add cereal or other food to a bottle."],"src":["raisingchildren-solids","unicef-6-12","aap-starting-solids"]},{"id":"gagging-vs-choking","title":"Gagging and choking are different","body":"Gagging is common while learning to eat. It is loud, with coughing, sputtering and watery eyes, and it moves food forward. Choking is silent: no cough, no cry, and the skin can turn pale or blue.","points":["Gagging is loud. Stay calm and let your baby work it out.","Choking is silent or near silent, with no strong cough.","Never sweep a finger through your baby's mouth.","If your baby is choking, call emergency services and start infant first aid.","An infant CPR and first aid course is worth taking before or soon after starting solids."],"src":["nhs-choking","aap-choking"]},{"id":"safe-shapes","title":"Shapes that lower choking risk","body":"Cut round foods like grapes and cherry tomatoes lengthwise into quarters. Cook hard vegetables until soft, spread nut butters thinly, and remove pits, bones and tough skins.","points":["Whole nuts, popcorn, hard candy and marshmallows stay off the menu until at least 4 years.","Cheese is shredded or thinly sliced, never cubed.","Raw hard vegetables and raw apple chunks wait until about 4 years.","Cut most foods to about 1/2 inch or smaller once your baby eats small pieces."],"src":["aap-choking"]},{"id":"allergen-basics","title":"Introducing common allergens","body":"Current guidance recommends introducing common allergens early and often. Offer one new allergen at a time, at home and earlier in the day, so you can watch for a few hours. Once it is tolerated, keep offering it a few times a week.","points":["The common ones are egg, peanut, milk, wheat, soy, sesame, tree nuts, fish and shellfish.","Start with a small amount mixed into a food your baby already eats.","Leave a few days between new allergens.","If your baby has severe eczema or an egg allergy, talk with your pediatrician about peanut around 4 to 6 months."],"src":["aap-allergens","niaid-peanut"]},{"id":"possible-reaction","title":"What a possible reaction can look like","body":"Milder signs often show in one place, like a few hives or redness around the mouth. Call emergency services right away for trouble breathing, swelling of the face, lips or tongue, repeated vomiting, or a baby who turns pale or floppy.","points":["Most reactions start within minutes to 2 hours of eating.","Repeated vomiting 2 to 4 hours after a food can also be a reaction. Call your pediatrician.","For milder signs, stop offering the food and call your pediatrician.","Note what you saw and when, with a photo if you can."],"src":["aap-allergens","niaid-peanut"]},{"id":"iron-often","title":"Iron-rich foods, often","body":"Babies need more iron from food starting around 6 months. Offer iron-rich foods often, like meat, beans, lentils, tofu, egg and iron-fortified cereal. Pair plant sources with a vitamin C food like tomato, orange or broccoli.","points":["Iron from meat, poultry and fish is the easiest for the body to take in.","Ask your pediatrician about iron if your baby is breastfed only."],"src":["cdc-iron","aap-vitamins"]},{"id":"first-cup","title":"Starting a cup","body":"From about 6 months, offer a few sips of water from an open cup or straw cup with meals. Skip valved sippy cups, which work like a bottle. Small amounts are plenty, up to about 8 oz of water a day.","points":["Hold the open cup at first and let your baby sip.","Spills are part of learning."],"src":["aap-bottle","cdc-faqs"]},{"id":"refusal-is-information","title":"A no today is information","body":"It's common for babies to refuse a new food many times before accepting it, and some foods take 10 to 15 tries. Keep offering small amounts in different ways, with no pressure.","points":["Try a new shape, texture or pairing next time.","Serve it next to a food your baby already enjoys.","Eating with your baby helps."],"src":["satter-sdor","cdc-mealtime"]},{"id":"daycare-handoff","title":"Sharing the plan with caregivers","body":"Share a short list with your caregivers: foods your baby eats, allergens in rotation, how you cut foods and which cup you use. Try new foods and new allergens at home const lowerNames = ids => { const l = ids.map(a => ALLERGEN_NAME[a].toLowerCase()); return l.length <= 1 ? (l[0] || '') : l.slice(0,-1).join(', ') + ' and ' + l[l.length-1]; };
function reasonText(r){
  switch (r.reason){
    case 'pinned': return 'You added this.';
    case 'first_allergen': return r.firstAllergen ? 'A first taste of ' + ALLERGEN_NAME[r.firstAllergen].toLowerCase() + ': a small amount, at home, early in the day.' : 'A first taste: a small amount, at home, early in the day.';
    case 'new_food': return 'Something new to try today.';
    case 'keep_going': return r.keepGoing && r.keepGoing.length ? 'Keeps ' + lowerNames(r.keepGoing) + ' in the week.' : 'Keeps a familiar allergen in the week.';
    case 'iron': return 'A good source of iron.';
    case 'vitamin_c': return 'Vitamin C helps the body use iron from plant foods.';
    case 'liked': return 'This went well before.';
    case 'retry': return 'Back in a different form. Many tries is common.';
    case 'familiar': return 'A familiar food at this meal.';
    case 'variety': return 'For variety across the week.';
    case 'softening': return 'Pears, prunes and peaches can help soften stools.';
    case 'suggested': return r.note || 'An idea for variety.';
  }
  return '';
}

            item('broccoli','soft_stick',[{reason:'vitamin_c'}]), item('sweet-potato','soft_stick',[{reason:'retry'}]) ]
};

  breakfast: [ item('oatmeal','mashed',[{reason:'liked'}]), item('peanut-powder','mixed_in',[{reason:'keep_going', keepGoing:['peanut']}]), item('banana','mashed',[{reason:'liked'}]) ],
  dinner: [ item('beef','minced',[{reason:'iron'}]), item('avocado','soft_stick',[{reason:'liked'}]), item('pasta','soft_stick',[{reason:'keep_going', keepGoing:['wheat']}]) ]

function buildDay(i){
  if (i === 0) return JSON.parse(JSON.stringify(TODAY));
  if (i === 1) return JSON.parse(JSON.stringify(TOMORROW));
  const grains = ['infant-oat-cereal','quinoa','oatmeal','infant-oat-cereal'];
  const fruits = ['mango','blueberry','peach','strawberry','pear','banana','prune','avocado'];
  const keeps = [['plain-yogurt','milk'],['peanut-powder','peanut'],['pasta','wheat'],['peanut-butter','peanut']];
  const prots = ['chicken-thigh','black-beans','salmon','beef','red-lentils','tofu','egg'];
  const vegs = ['butternut-squash','peas','zucchini','spinach','carrot','broccoli','sweet-potato'];
  const pick = f => { const ff = F[f].forms; return ff.includes('mashed') ? 'mashed' : ff[0]; };
  const fr = fruits[i % 8], g = grains[i % 4], k = keeps[i % 4];
  const breakfast = [ item(g, pick(g), [{reason: F[g].iron >= 2 ? 'iron' : 'familiar'}]),
                      item(fr, pick(fr), [{reason: HIST[fr] ? 'liked' : 'new_food'}]),
                      item(k[0], F[k[0]].forms.includes('mixed_in') ? 'mixed_in' : pick(k[0]), [{reason:'keep_going', keepGoing:[k[1]]}]) ];
  if (i === 2) breakfast.unshift(item('tofu','mashed',[{reason:'first_allergen', firstAllergen:'soy'}]));
  const p = prots[i % 7], v = vegs[i % 7], f2 = fruits[(i + 3) % 8];
  const dinner = [ item(p, pick(p), [{reason: HIST[p] ? 'iron' : 'new_food'},{reason:'iron'}]),
                   item(v, pick(v), [{reason: ['broccoli','spinach'].includes(v) ? 'vitamin_c' : HIST[v] ? 'familiar' : 'variety'}]),
                   item(f2, pick(f2), [{reason: f2 === 'prune' || f2 === 'pear' || f2 === 'peach' ? 'softening' : 'variety'}]) ];
  return { breakfast, dinner };
}

function badgesFor(it){
  const f = F[it.id], out = [];
  it.r.forEach(r => {
    if (r.reason === 'first_allergen') out.push('<span class="badge b-first">First taste: ' + esc(ALLERGEN_NAME[r.firstAllergen].toLowerCase()) + '</span>');
    if (r.reason === 'keep_going') out.push('<span class="badge b-keep">Keeps ' + esc(lowerNames(r.keepGoing)) + ' in the week</span>');
    if (r.reason === 'new_food') out.push('<span class="badge b-new">New</span>');

function allergenWeekCard(){
  const rows = [];
  const fmt = (id, a) => {
    if (a.s === 'not_started' && id === 'egg') return { s:'First taste today, at breakfast', c:'' };
    if (a.s === 'not_started' && a.next) return { s:STATE_LABEL.not_started + '. First taste planned ' + a.next, c:'' };
    if (a.s === 'held') return { s:STATE_LABEL.held, c:'', held:true };
    return { s:STATE_LABEL[a.s], c: a.of ? a.wk + ' of ' + a.of + ' this week' : '', wk:a.wk, of:a.of };
  };
  ['peanut','milk','wheat','egg','soy','sesame'].forEach(id => {
    const a = M.allergens[id], v = fmt(id, a);
    rows.push('<div class="alrow"><div><div class="an">' + esc(ALLERGEN_NAME[id]) + (v.held ? ' <span class="badge b-hold">On hold</span>' : '') + '</div><div class="as">' + esc(v.s) + '</div></div>' +
      (v.c ? '<div class="ac"><span class="mono">' + esc(v.c) + '</span><div class="pips" aria-hidden="true">' + Array.from({length:v.of}, (_, k) => '<i class="pip' + (k < v.wk ? ' on' : '') + '"></i>').join('') + '</div></div>' : '') + '</div>');
  });
  return '<section class="card" aria-label="Allergens this week">' + rows.join('') + '</section>';
}

function dayCard(i, locked){
  const open = !!S.open[i];
  const d = M.plan[i];
  const n = d.breakfast.length + d.dinner.length;
  const name = dayName(i), short = dayShort(i);
  if (locked){
    return '<section class="card day locked"><div class="dayhead"><button class="daytoggle" data-act="lockedday" aria-label="' + esc(name + ', ' + short + '. Locked, part of NibbleCue Plus') + '">' +
      '<span class="lockico">' + ic('i-lock') + '</span><span><span class="dn">' + esc(name) + '</span><br><span class="dd">' + esc(short) + ' · 2 meals</span></span><span class="badge b-plus" style="margin-left:auto">Plus</span></button></div>' +
      '<div class="daybody" aria-hidden="true"><div class="skel"><h4>Breakfast</h4><i class="bar l"></i><i class="bar m"></i><i class="bar s"></i><h4>Dinner</h4><i class="bar m"></i><i class="bar l"></i></div></div></section>';
  }
  const skipped = M.skipped[i];
  let body = '';
  if (open){
    body = skipped
      ? '<div class="daybody"><div class="skipped"><span class="ico neutral" aria-hidden="true">' + ic('i-cal') + '</span><span class="small" style="flex:1">Skipped. The plan moves its new foods to the next day.</span><button class="btn ghost" data-act="unskip" data-day="' + i + '">Undo skip</button></div></div>'
      : '<div class="daybody">' + ['breakfast','dinner'].map(m => '<div class="pmeal"><h4>' + (m === 'breakfast' ? 'Breakfast' : 'Dinner') + (M.served[i + ':' + m] ? ' · served' : '') + '</h4>' +
          d[m].filter(it => !isHeld(it.id)).map(it => '<button class="pfood" data-act="planfood" data-day="' + i + '" data-meal="' + m + '" data-id="' + it.id + '"><span class="fdisc" aria-hidden="true">' + fglyph(F[it.id]) + '</span><span class="fb"><span class="fname">' + esc(F[it.id].name) + '<span class="form">' + esc(FORM_LABEL[it.form]) + '</span></span><span class="why">' + esc(reasonText(it.r[0])) + '</span></span>' + ic('i-dots','chev') + '</button>').join('') + '</div>').join('') + '</div>';
  }
  return '<section class="card day"><div class="dayhead"><button class="daytoggle" data-act="toggleday" data-day="' + i + '" aria-expanded="' + open + '">' +
    '<span class="ico olive" aria-hidden="true">' + ic('i-cal') + '</span><span><span class="dn">' + esc(name) + '</span><br><span class="dd">' + esc(short) + (skipped ? ' · skipped' : ' · ' + n + ' foods') + '</span></span>' + ic('i-chevd','cv') + '</button>' +
    '<button class="dots" data-act="dayactions" data-day="' + i + '" aria-label="' + esc('Actions for ' + name) + '">' + ic('i-dots') + '</button></div>' + body + '</section>';
}

function foodList(){
  const q = S.q.trim().toLowerCase();
  const all = M.custom.map(c => F[c.id]).concat(FOODS);
  const list = all.filter(f => {
    if (q && !f.name.toLowerCase().includes(q)) return false;
    switch (S.filter){
      case 'first': return f.ff;
      case 'allergens': return f.al.length > 0;
      case 'iron': return f.iron >= 2;
      case 'untried': return !HIST[f.id];
      case 'tried': return !!HIST[f.id];
    }
    return true;
  });
  if (!list.length) return '<p class="empty">No foods match. Try another word, or add your own food.</p>';
  return '<div class="group">' + list.map(f => '<button class="frow" data-act="push" data-p="food" data-id="' + f.id + '"><span class="fdisc" aria-hidden="true">' + fglyph(f) + '</span>' +
    '<span class="fb" style="flex:1;min-width:0"><b>' + esc(f.name) + '</b><span>' + esc((f.forms || []).slice(0,2).map((x, k) => k ? FORM_LABEL[x].toLowerCase() : FORM_LABEL[x]).join(' or ') + (f.al.length ? ' · ' + lowerNames(f.al) : '')) + '</span></span>' + statusBadge(f.id) + '</button>').join('') + '</div>';
}

function renderBar(){
  const bar = $('bar');
  if (!bar.childElementCount){
    bar.innerHTML = TABS.map(t => '<button role="tab" data-act="tab" data-tab="' + t[0] + '" aria-label="' + t[1] + '">' + ic(t[2]) + '<span aria-hidden="true">' + t[1] + '</span></button>').join('') + '<i class="tdot" aria-hidden="true"></i>';
  }
  const btns = [...bar.querySelectorAll('button')];
  btns.forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const cur = btns.find(b => b.dataset.tab === S.tab);
  const dot = bar.querySelector('.tdot');
  if (cur){ dot.style.left = (cur.offsetLeft + cur.offsetWidth / 2 - 2.5) + 'px'; }

  const showFab = S.tab === 'today' && !S.stack.length;
  fab.hidden = !showFab; fab.tabIndex = showFab ? 0 : -1;
}

function altsFor(id, exclude){
  const f = F[id];

  const same = pool.filter(x => x.cat === f.cat);
  const iron = pool.filter(x => x.iron >= 2 && x.cat !== f.cat);
  const list = (same.length >= 3 ? same : same.concat(iron)).slice(0, 3);
  return list.map(x => { const form = x.forms.includes('mashed') ? 'mashed' : x.forms[0];
    const reason = HIST[x.id] && /lov|lik/.test(HIST[x.id].resp) ? 'liked' : !HIST[x.id] ? 'new_food' : x.iron >= 2 ? 'iron' : 'variety';
    return item(x.id, form, [{ reason }]); });
}

  demo(d){ closeSheet(); toast(d.v); },
  closesheet(){ closeSheet(); },
  undo(){ if (!undoSnap) return; M = JSON.parse(undoSnap); undoSnap = null; $('toast').classList.remove('on'); render(); },
  startsetup(d){ closeSheet(); startSetup(d.step ? +d.step : 0); },
  supick(d){ S.setup.a[STEPS[S.setup.i].k] = d.v; renderSetup(); },
  suthen(d){ const st = STEPS[S.setup.i]; const t = st.then[S.setup.a[st.k]]; S.setup.a[t.k] = d.v; renderSetup(); },
  sumany(d){ const k = STEPS[S.setup.i].k, a = S.setup.a[k], i = a.indexOf(d.v);
    const solo = ['none','noneyet'];
    if (i >= 0) a.splice(i, 1); else { if (solo.includes(d.v)) a.length = 0; else { const j = a.findIndex(x => solo.includes(x)); if (j >= 0) a.splice(j, 1); } a.push(d.v); }
    renderSetup(); },
  sunext(){ const st = S.setup; if (st.i < 9){ st.i++; renderSetup(true); } else { st.done = true; renderSetup(true); } },
  suback(){ const st = S.setup; if (st.i > 0){ st.i--; renderSetup(true); } else ACT.setupclose(); },
  setupclose(){ const s = $('setup'); s.classList.remove('on'); s.setAttribute('aria-hidden','true'); S.setup = null; },
  setupdone(){ ACT.setupclose(); go(() => { S.tab = 'today'; S.stack = []; }); toast('Demo: setup answers are not saved in this prototype.'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'foodq'){ S.q = e.target.value; $('foodlist').innerHTML = foodList(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('emerg').classList.contains('on')) return ACT.emergback();
  if (S.sheet) return closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'shopin') ACT.shoponeoff(); });
window.addEventListener('resize', () => renderBar());

/* hooks for the screenshot script, harmless in a browser */
window.NC = { S, ACT, render, openSheet, showEmergency, startSetup, go };
render({ fade:true });
</script>
</body>
</html>
